# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-zedboard-custom"
BBFILE_PATTERN_meta-zedboard-custom = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-zedboard-custom = "10"

LAYERDEPENDS_meta-zedboard-custom = "core xilinx xilinx-tools"
LAYERSERIES_COMPAT_meta-zedboard-custom = "scarthgap"

